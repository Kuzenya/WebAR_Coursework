<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebAR | 3D Sculpture</title>

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #202020;
            color: white;
        }

        header {
            text-align: center;
            padding: 20px;
        }

        model-viewer {
            width: 100%;
            height: 70vh;
            background-color: #303030;
        }

        .info {
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>3D Sculpture AR</h1>
    <p>Интерактивный просмотр 3D-модели</p>
</header>



<model-viewer
    src="models/Pasha.glb"
    ios-src="models/Pasha.usdz"
    alt="Скульптура Павла Николаевича Ивлева"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    environment-image="assets/studio.hdr"
    shadow-intensity="1"
    exposure="1"
    camera-orbit="0deg 75deg 3m"
    min-camera-orbit="auto auto 1m"
    max-camera-orbit="auto auto 10m"
    scale="1 1 1"
    ar-scale="auto"
    ar-placement="floor">

    <button slot="ar-button">
        Запустить AR
    </button>

</model-viewer>

<div class="info">
    <p>
        Вращайте модель мышью или пальцами.
        На совместимом устройстве нажмите «Запустить AR».
    </p>
</div>

</body>
</html>
