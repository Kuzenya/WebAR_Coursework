
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Практика 4 | Three.js + WebXR Hit Test</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #info {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 2;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
        }

        #status {
            color: #a7f3a7;
            margin-top: 5px;
        }

        #home {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            padding: 12px 18px;
            border-radius: 10px;
            background: #333;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="info">
        <strong>Практика 4: Three.js + WebXR Hit Test</strong>
        <div>Наведите камеру на пол или стол.</div>
        <div>Когда появится зелёное кольцо, коснитесь экрана.</div>
        <div>Фигуры будут чередоваться: крестик, нолик, крестик...</div>
        <div id="status">Загрузка моделей...</div>
    </div>

    <a id="home" href="../index.html">← К заданиям</a>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene;
        let camera;
        let renderer;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        let crossModel = null;
        let circleModel = null;
        let placementCount = 0;

        const statusElement = document.getElementById('status');
        const loader = new GLTFLoader();

        function setStatus(message) {
            statusElement.textContent = message;
        }

        init();

        function init() {
            // Создаём сцену
            scene = new THREE.Scene();

            // Создаём камеру
            camera = new THREE.PerspectiveCamera(
                70,
                window.innerWidth / window.innerHeight,
                0.01,
                20
            );

            // Освещение
            const hemisphereLight = new THREE.HemisphereLight(
                0xffffff,
                0xbbbbff,
                2
            );
            scene.add(hemisphereLight);

            const directionalLight = new THREE.DirectionalLight(
                0xffffff,
                1.5
            );
            directionalLight.position.set(1, 3, 2);
            scene.add(directionalLight);

            // Настраиваем WebGL
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });

            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            renderer.xr.setReferenceSpaceType('local-floor');

            document.body.appendChild(renderer.domElement);

            // Кнопка запуска AR
            const arButton = ARButton.createButton(renderer, {
                requiredFeatures: ['hit-test']
            });

            document.body.appendChild(arButton);

            // Маркер поверхности в виде зелёного кольца
            const ringGeometry = new THREE.RingGeometry(
                0.08,
                0.12,
                32
            );

            ringGeometry.rotateX(-Math.PI / 2);

            const ringMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ff88,
                side: THREE.DoubleSide
            });

            reticle = new THREE.Mesh(ringGeometry, ringMaterial);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;

            scene.add(reticle);

            // Контроллер получает нажатия пользователя
            const controller = renderer.xr.getController(0);
            controller.addEventListener('select', placeObject);
            scene.add(controller);

            // Загружаем крестик
            loader.load(
                './models/cross.glb',
                (gltf) => {
                    crossModel = gltf.scene;
                    setStatus('Крестик загружен. Загружаем нолик...');
                    checkModelsLoaded();
                },
                undefined,
                (error) => {
                    console.error('Ошибка загрузки cross.glb:', error);
                    setStatus('Ошибка загрузки models/cross.glb');
                }
            );

            // Загружаем нолик
            loader.load(
                './models/circle.glb',
                (gltf) => {
                    circleModel = gltf.scene;
                    setStatus('Нолик загружен.');
                    checkModelsLoaded();
                },
                undefined,
                (error) => {
                    console.error('Ошибка загрузки circle.glb:', error);
                    setStatus('Ошибка загрузки models/circle.glb');
                }
            );

            // Начало AR-сессии
            renderer.xr.addEventListener('sessionstart', () => {
                hitTestSourceRequested = false;
                hitTestSource = null;
                reticle.visible = false;

                setStatus(
                    'AR запущен. Направьте камеру на пол или стол.'
                );
            });

            // Завершение AR-сессии
            renderer.xr.addEventListener('sessionend', () => {
                if (hitTestSource) {
                    hitTestSource.cancel();
                }

                hitTestSource = null;
                hitTestSourceRequested = false;
                reticle.visible = false;

                setStatus(
                    'AR завершён. Нажмите кнопку AR для повторного запуска.'
                );
            });

            window.addEventListener('resize', onWindowResize);

            renderer.setAnimationLoop(render);
        }

        function checkModelsLoaded() {
            if (crossModel && circleModel) {
                setStatus(
                    'Обе модели загружены. Можно запускать AR.'
                );
            }
        }

        // Размещаем крестик или нолик на найденной поверхности
        function placeObject() {
            if (!reticle.visible) {
                setStatus(
                    'Поверхность не найдена. Медленно перемещайте телефон.'
                );
                return;
            }

            const isCrossTurn = placementCount % 2 === 0;
            const sourceModel = isCrossTurn
                ? crossModel
                : circleModel;

            if (!sourceModel) {
                setStatus(
                    'Модели ещё загружаются. Подождите немного.'
                );
                return;
            }

            // Клонируем модель, чтобы каждый объект был отдельным
            const placedModel = sourceModel.clone(true);

            // Копируем позицию и ориентацию маркера
            reticle.matrix.decompose(
                placedModel.position,
                placedModel.quaternion,
                placedModel.scale
            );

            // Масштаб моделей.
            // Измени 0.5, если модели слишком большие или маленькие.
            placedModel.scale.multiplyScalar(0.5);

            // Добавляем объект в сцену.
            // Он больше не связан с маркером.
            scene.add(placedModel);

            placementCount++;

            const placedName = isCrossTurn ? 'крестик' : 'нолик';
            const nextName = placementCount % 2 === 0
                ? 'крестик'
                : 'нолик';

            setStatus(
                `Размещён ${placedName}. Следующим будет ${nextName}.`
            );
        }

        // Получение результатов Hit Test
        function render(timestamp, frame) {
            if (frame) {
                const session = renderer.xr.getSession();
                const referenceSpace = renderer.xr.getReferenceSpace();

                if (!hitTestSourceRequested && session) {
                    hitTestSourceRequested = true;

                    session.requestReferenceSpace('viewer')
                        .then((viewerSpace) => {
                            return session.requestHitTestSource({
                                space: viewerSpace
                            });
                        })
                        .then((source) => {
                            if (renderer.xr.getSession() === session) {
                                hitTestSource = source;
                            } else {
                                source.cancel();
                            }
                        })
                        .catch((error) => {
                            console.error('Hit Test error:', error);

                            setStatus(
                                'Не удалось запустить Hit Test. ' +
                                'Проверьте поддержку WebXR.'
                            );

                            hitTestSourceRequested = false;
                        });
                }

                if (hitTestSource && referenceSpace) {
                    const results = frame.getHitTestResults(
                        hitTestSource
                    );

                    if (results.length > 0) {
                        const hit = results[0];
                        const pose = hit.getPose(referenceSpace);

                        if (pose) {
                            reticle.visible = true;

                            reticle.matrix.fromArray(
                                pose.transform.matrix
                            );

                            if (crossModel && circleModel) {
                                const nextName =
                                    placementCount % 2 === 0
                                        ? 'крестик'
                                        : 'нолик';

                                setStatus(
                                    `Поверхность найдена. ` +
                                    `Следующий объект: ${nextName}.`
                                );
                            }
                        }
                    } else {
                        reticle.visible = false;

                        setStatus(
                            'Ищем поверхность. Медленно перемещайте телефон.'
                        );
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }
    </script>

</body>
</html>
